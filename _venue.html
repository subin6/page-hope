<!DOCTYPE html><html lang="en" class="js"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="./static/css/index.css">
<style>
 body{background:#fff}
 .row{padding:34px 0 30px;border-bottom:1px solid #e8e8ef;text-align:center}
 .tag{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:#aaa;display:block;margin-bottom:14px}
 h1{font-size:2.1rem;font-weight:800;letter-spacing:-.025em;line-height:1.14;margin:0 0 .7rem}
 /* A: bigger accent text */
 .vA{font-size:1.38rem;font-weight:700;color:var(--accent);margin:0}
 /* B: solid pill */
 .vB{display:inline-block;font-size:1rem;font-weight:700;letter-spacing:.01em;color:#fff;background:var(--accent);border-radius:999px;padding:.34rem 1.05rem;margin:0}
 /* C: soft pill */
 .vC{display:inline-block;font-size:1rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border:1px solid rgba(29,78,216,.22);border-radius:999px;padding:.34rem 1.05rem;margin:0}
 /* D: gradient text, matching the wordmark */
 .vD{font-size:1.38rem;font-weight:800;margin:0;background:linear-gradient(100deg,var(--grad-a) 5%,var(--grad-b) 95%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
 /* E: gradient pill */
 .vE{display:inline-block;font-size:1rem;font-weight:700;color:#fff;border-radius:999px;padding:.34rem 1.05rem;margin:0;background:linear-gradient(100deg,var(--grad-a) 5%,var(--grad-b) 95%)}
</style></head><body>
<div id="r"></div>
<script>
var T='<h1><span class="brand-grad">HOPE</span>: Hand-Object Pressure Estimation</h1>';
[['A — 현재보다 크게 (1.38rem, 액센트)','vA'],['B — 솔리드 알약','vB'],['C — 연한 알약','vC'],
 ['D — 그라데이션 텍스트','vD'],['E — 그라데이션 알약','vE']].forEach(function(o){
  document.getElementById('r').insertAdjacentHTML('beforeend',
   '<div class="row"><span class="tag">'+o[0]+'</span>'+T+'<p class="'+o[1]+'">NeurIPS 2026</p></div>');
});
</script></body></html>
